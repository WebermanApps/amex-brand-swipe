<!DOCTYPE html>
<html lang="en"><head>

<meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light only">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Khand:wght@700&display=swap" rel="stylesheet">
<style>
:root{--mw-background:#fff;--mw-foreground:#0a0a0a;--mw-primary:#171717;--mw-primary-foreground:#fafafa;--mw-secondary:#f5f5f5;--mw-muted-text:#737373;--mw-border:#e5e5e5;--mw-dark-surface:#0a0a0a;--mw-font-heading:"Khand",sans-serif;--mw-font-body:"Hind",system-ui,sans-serif;--mw-radius:.625rem;--mw-tracking-label:.1em;--c-love:#E0245E;--c-yes:#2E9E6A;--c-maybe:#D99A1E;--c-no:#9A7B7B;--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms}
.mw-hover{transition:transform var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease),color var(--mw-dur) var(--mw-ease)}
.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover{transition:none;transform:none}}
*{box-sizing:border-box}html,body{margin:0;background:var(--mw-background);color:var(--mw-foreground);font-family:var(--mw-font-body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;-webkit-text-size-adjust:100%}
body.swiping{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
body.swiping footer{display:none}
body.swiping main{display:flex;flex-direction:column;min-height:0}
header{padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--mw-border)}
.wordmark{font-family:var(--mw-font-heading);font-weight:700;letter-spacing:var(--mw-tracking-label);font-size:14px}
main{flex:1;max-width:480px;width:100%;margin:0 auto;padding:14px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--mw-font-heading);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0 0 8px}
h1{font-size:clamp(26px,7.5vw,34px)}
p{font-size:16px}h2{font-size:26px}h3{font-size:20px}
.muted{color:var(--mw-muted-text)}
.progress{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text);margin:12px 0 6px}
.bar{height:4px;background:var(--mw-secondary);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--c-yes),var(--c-maybe),var(--c-love));opacity:.75;width:0;transition:width .25s}
.stack{position:relative;flex:1;min-height:240px;max-height:440px;margin:14px 0;touch-action:none}
.card{position:absolute;inset:0;background:#fff;border:1px solid var(--mw-border);border-radius:1rem;box-shadow:0 4px 16px rgba(10,10,10,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;user-select:none;cursor:grab}
.card{touch-action:none;padding:20px}
.card .emoji{font-size:clamp(52px,16vw,72px);line-height:1;margin-bottom:18px}
.card .cat{font-size:12px;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text);border:1px solid var(--mw-border);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.card h2{font-size:clamp(28px,8.5vw,36px)}.card p{margin:6px 0 0;color:var(--mw-muted-text);font-size:17px}
.stamp{position:absolute;top:20px;font-family:var(--mw-font-heading);font-size:24px;letter-spacing:var(--mw-tracking-label);border:2px solid var(--mw-primary);padding:2px 10px;opacity:0;text-transform:uppercase}
.stamp.like{left:20px;color:var(--c-yes);border-color:var(--c-yes)}.stamp.skip{right:20px;color:var(--c-no);border-color:var(--c-no)}
.btn.c-no{border-color:var(--c-no);color:var(--c-no)}.btn.c-no:hover{background:var(--c-no);color:#fff}
.btn.c-maybe{border-color:var(--c-maybe);color:#a36f0c}.btn.c-maybe:hover{background:var(--c-maybe);color:#fff}
.btn.c-love{border-color:var(--c-love);color:var(--c-love)}.btn.c-love:hover{background:var(--c-love);color:#fff}
.btn.c-yes{border-color:var(--c-yes);background:var(--c-yes);color:#fff}.btn.c-yes:hover{background:#25875a;border-color:#25875a}
.swipehint{text-align:center;font-size:14px;color:var(--mw-muted-text);margin:10px 0 0;letter-spacing:.02em;transition:opacity .25s ease-out,transform .25s ease-out}
.swipehint .l{color:var(--c-no);display:inline-block;animation:pl 1.4s ease-in-out infinite}.swipehint .r{color:var(--c-yes);display:inline-block;animation:pr 1.4s ease-in-out infinite}
.swipehint.gone{opacity:0;transform:scale(.96)}
@keyframes pl{50%{transform:translateX(-4px);opacity:.55}}@keyframes pr{50%{transform:translateX(4px);opacity:.55}}
.card.nudge{animation:nudge 2.4s ease-in-out .3s 2}
.card.nudge .stamp.skip{animation:sn 2.4s ease-in-out .3s 2}.card.nudge .stamp.like{animation:sy 2.4s ease-in-out .3s 2}
@keyframes nudge{0%,100%{transform:none}20%{transform:translateX(-22px) rotate(-4deg)}40%{transform:none}60%{transform:translateX(22px) rotate(4deg)}80%{transform:none}}
@keyframes sn{0%,40%,100%{opacity:0}20%{opacity:.45}}@keyframes sy{0%,40%,100%{opacity:0}60%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.card.nudge,.card.nudge .stamp{animation:none}.swipehint .l,.swipehint .r{animation:none}}
.lbl-love{color:var(--c-love)}.lbl-yes{color:var(--c-yes)}.lbl-maybe{color:#a36f0c}
.chip.love{background:#fde8ef}.chip.yes{background:#e6f4ec}.chip.maybe{background:#fbf1dc}
.card .cat{background:var(--cat-bg,transparent)}
.btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.btn{font-family:var(--mw-font-body);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);border:2px solid var(--mw-primary);background:transparent;color:var(--mw-primary);padding:10px 2px;min-height:52px;border-radius:0;touch-action:manipulation;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--mw-secondary)}
.btn.solid{background:#fff;color:var(--mw-primary);border-width:3px}
.hint{text-align:center;font-size:13px;margin:10px 0 0}
@media (hover:none){.keyhint{display:none}}
.link{min-height:44px;min-width:44px}
footer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.link{background:none;border:0;font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text);border-bottom:1px solid rgba(10,10,10,.3);cursor:pointer;padding:2px 0}
.link:hover{color:var(--mw-foreground);border-color:var(--mw-foreground)}
.rank{border:1px solid var(--mw-border);border-radius:.75rem;padding:14px 16px;margin:10px 0}
.rank .top{display:flex;justify-content:space-between;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--mw-secondary);border-radius:999px;padding:3px 10px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
footer{background:#FAF8F4;border-top:1px solid var(--mw-border);color:var(--mw-muted-text);text-align:center;font-size:12px;padding:16px;letter-spacing:var(--mw-tracking-label);text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#fff;color:var(--mw-foreground);border:1px solid var(--mw-border);box-shadow:0 6px 18px rgba(10,10,10,.12);padding:10px 16px;border-radius:.5rem;opacity:0;transition:opacity .2s;pointer-events:none}
</style><!--mw-polish--><style id="mw-polish">
/* MW polish layer: /workspace/ops/brand/app-polish-spec.md (Oct 10, 2026). Light mode, brand motion, 44px targets. */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms;--mw-ink:#171717;--mw-grey:#737373;--mw-line:#E5E5E5;--mw-jungle:#0B6E4F;--mw-lagoon:#05668D;--mw-terra:#C1502E}
html{color-scheme:light only}
:where(button,.btn,a.btn,[role=button]){transition:translate var(--mw-dur) var(--mw-ease),scale var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){:where(button,.btn,a.btn):not(:disabled):not(.leaflet-container *):hover{translate:0 -1px;scale:1.03;box-shadow:0 6px 18px rgba(10,10,10,.12)}}
:where(button,.btn):not(:disabled):not(.leaflet-container *):active{scale:.97}
:where(a:not(.btn)){text-underline-offset:4px}
:focus-visible{outline:2px solid var(--mw-lagoon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.mw-share{min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--mw-ink);background:#fff;color:var(--mw-ink);font-family:Khand,Hind,system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:0;cursor:pointer}
.mw-share-float{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50}

/* Mom's Shopping Quiz: Share button in the header (brand share spec) */
header .mw-share{margin-left:8px;font-size:12px;padding:0 10px}

</style><script id="mw-share">(function(){function go(){if(document.getElementById('mwShare'))return;var b=document.createElement('button');b.id='mwShare';b.type='button';b.className='mw-share';b.textContent='⇪ Share';b.setAttribute('aria-label','Share this page');
var host=document.querySelector('header')||document.body;if(host===document.body)b.classList.add('mw-share-float');host.appendChild(b);
b.addEventListener('click',async function(){var url=location.origin+location.pathname,t=document.title;
 if(navigator.share){try{await navigator.share({title:t,url:url});return}catch(e){if(e&&e.name==='AbortError')return}}
 if(/iPhone|iPad|Android/i.test(navigator.userAgent)){location.href='sms:?&body='+encodeURIComponent(t+' '+url);return}
 try{await navigator.clipboard.writeText(url);b.textContent='Link Copied';setTimeout(function(){b.textContent='⇪ Share'},1800)}catch(e){prompt('Copy this link:',url)}});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();
</script><!--/mw-polish-->
</head><body>
<header><span class="wordmark">MAX WEBERMAN</span><button class="link mw-hover" id="reset">Start Over</button></header>
<main id="app"></main>
<footer>Mom's Shopping Quiz</footer>
<div class="toast" id="toast"></div>
<script>
const BRANDS=[
["Saks Fifth Avenue","Fashion","👜","Luxury department store for designer fashion."],
["Nordstrom","Fashion","🧥","Department store with clothing, shoes and great service."],
["Macy's","Fashion","🛍️","Classic department store for everyday fashion and home."],
["Lululemon","Fashion","🧘","Athletic and leisure wear built for comfort."],

["Ulta Beauty","Beauty","💅","Beauty products plus an in-store salon."],

["Target","Home","🎯","Everyday essentials, home goods and more."],

["Lowe's","Home","🪚","Home improvement, appliances and garden."],
["Wayfair","Home","🛋️","Furniture and home décor delivered."],
["Williams Sonoma","Home","🍳","Premium cookware and kitchen essentials."],
["Resy Restaurants","Dining","🍽️","Reservations at popular local restaurants."],
["Starbucks","Dining","☕","Coffee, tea and a quick bite on the go."],
["Uber Eats","Dining","🍔","Restaurant delivery to your door."],
["DoorDash","Dining","🥡","Food and convenience delivery."],
["Grubhub","Dining","🍕","Takeout and delivery from local spots."],
["Marriott Bonvoy","Travel","🏨","Hotels and resorts around the world."],
["Hilton","Travel","🛎️","Hotels from Hampton to Waldorf Astoria."],
["Fine Hotels + Resorts","Travel","🌴","Luxury hotel stays with extra perks."],
["Delta Air Lines","Travel","✈️","Major airline with flights worldwide."],
["Expedia","Travel","🧳","Book flights, hotels and cars in one place."],
["Uber","Travel","🚗","Rides around town, anytime."],
["Hertz","Travel","🚙","Rental cars at airports and in town."],
["CLEAR","Travel","🛂","Faster airport security with ID scanning."],
["Disney+","Streaming","🏰","Disney, Pixar, Marvel and Star Wars shows."],
["Hulu","Streaming","📺","TV shows, movies and next-day episodes."],
["Peacock","Streaming","🦚","NBC shows, movies, news and sports."],
["The New York Times","Streaming","📰","News, cooking and games subscription."],
["Equinox","Fitness","🏋️","Upscale gyms and fitness classes."],
["SoulCycle","Fitness","🚴","High-energy indoor cycling classes."],
["Peloton","Fitness","🚲","At-home bikes and streamed workouts."],
["Apple","Electronics","🍎","iPhone, iPad, Mac and accessories."],
["Best Buy","Electronics","🔌","TVs, computers, appliances and gadgets."],
["Dell","Electronics","💻","Laptops, desktops and monitors."],
["Amazon","Electronics","📦","Shop almost anything, delivered fast."],
["CVS","Pharmacy","💊","Pharmacy, health and everyday essentials."],
["Walgreens","Pharmacy","🩺","Pharmacy, vitamins and convenience items."],
["Chewy","Pets","🐶","Pet food, supplies and pharmacy delivered."],
["Petco","Pets","🐱","Pet supplies, grooming and vet care."],
["BarkBox","Pets","🦴","Monthly box of dog toys and treats."],
["Carter's","Kids","👶","Baby and kids' clothing basics."],
["Pottery Barn Kids","Kids","🧸","Kids' furniture, bedding and décor."],
["LEGO","Kids","🧱","Building sets for kids of all ages."]
].map(([name,category,emoji,desc])=>({name,category,emoji,desc}));
const CATC={Fashion:"#f6eef6",Beauty:"#fdeef2",Groceries:"#edf6ec",Home:"#f4efe7",Dining:"#fdf1e6",Travel:"#eaf2f8",Streaming:"#efedf8",Fitness:"#e9f6f3",Electronics:"#eef0f3",Pharmacy:"#eef6f6",Pets:"#f8f2e6",Kids:"#fbf6dd"};
const KEY="mw-amex-brand-swipe-v2";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{i:0,picks:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const app=document.getElementById("app");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)}
function render(){S.i>=BRANDS.length?results():cardView()}
function cardView(){
 document.body.classList.add("swiping");
 const b=BRANDS[S.i];
 app.innerHTML=`<h1>Which Brands Do You Love?</h1><p class="muted" style="margin:4px 0 0">Swipe right for Yes, left for No. Or tap Maybe or Love.</p>
 <div class="progress"><span>${S.i+1}/${BRANDS.length}</span><button class="link mw-hover" id="back" ${S.i?"":"hidden"}>Undo</button></div><div class="bar"><i style="width:${S.i/BRANDS.length*100}%"></i></div>
 <p class="swipehint gone" id="swipehint" aria-live="polite"><span class="l">←</span> Swipe No · Swipe Yes <span class="r">→</span></p><div class="stack"><div class="card mw-hover" id="card"><span class="stamp like">Yes</span><span class="stamp skip">No</span>
 <div class="emoji">${b.emoji}</div><div class="cat" style="--cat-bg:${CATC[b.category]||"transparent"}">${b.category}</div><h2>${b.name}</h2><p>${b.desc}</p></div></div>
 <div class="btns"><button class="btn c-no mw-hover" data-a="no">← No</button><button class="btn c-maybe mw-hover" data-a="maybe">? Maybe</button><button class="btn c-love mw-hover" data-a="love">♥ Love</button><button class="btn c-yes mw-hover" data-a="yes">Yes →</button></div>
 <p class="hint muted keyhint">Keys: ← No · → Yes · ↓ or M Maybe · ↑ or L Love</p>`;
 app.querySelectorAll(".btn").forEach(x=>x.onclick=()=>act(x.dataset.a));
 const bk=document.getElementById("back");if(bk)bk.onclick=()=>{S.i--;delete S.picks[BRANDS[S.i].name];save();render()};
 drag(document.getElementById("card"));
 clearTimeout(idleT);if(S.i===0)setTimeout(showHint,150);else armIdle();
}
let idleT;const IDLE=5000;
function armIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{if(document.getElementById("card"))showHint()},IDLE)}
function showHint(){const h=document.getElementById("swipehint"),c=document.getElementById("card");if(!h||!c)return;h.classList.remove("gone");
 c.classList.remove("nudge");void c.offsetWidth;c.classList.add("nudge")}
function hideHint(){const h=document.getElementById("swipehint"),c=document.getElementById("card");if(h)h.classList.add("gone");if(c)c.classList.remove("nudge")}
function act(a,dx=0,dy=0){
 hideHint();clearTimeout(idleT);
 const c=document.getElementById("card");const b=BRANDS[S.i];S.picks[b.name]=a;S.i++;save();
 const tx=a==="yes"?600:a==="no"?-600:0,ty=a==="love"?-700:a==="maybe"?700:0;
 c.style.transition="transform .25s ease-out,opacity .25s";c.style.transform=`translate(${tx||dx}px,${ty||dy}px) rotate(${tx/30}deg)`;c.style.opacity=0;
 setTimeout(render,230);
}
function drag(c){let sx,sy,on=false;
 c.onpointerdown=e=>{hideHint();clearTimeout(idleT);on=true;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.style.transition="none"};
 c.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`;
  c.querySelector(".like").style.opacity=dx>0?Math.min(dx/100,1):0;c.querySelector(".skip").style.opacity=dx<0?Math.min(-dx/100,1):0};
 c.onpointerup=c.onpointercancel=e=>{if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(dx>100)act("yes");else if(dx<-100)act("no");
  else{armIdle();c.style.transition="transform .2s ease-out";c.style.transform="";c.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}};
}
document.onkeydown=e=>{if(S.i>=BRANDS.length||!document.getElementById("card"))return;const k={ArrowRight:"yes",ArrowLeft:"no",ArrowDown:"maybe",ArrowUp:"love",m:"maybe",M:"maybe",l:"love",L:"love"}[e.key];if(k){e.preventDefault();act(k)}};
function summary(){
 const cats={};BRANDS.forEach(b=>{cats[b.category]??={category:b.category,love:[],yes:[],maybe:[],no:[],total:0};const p=S.picks[b.name],c=cats[b.category];c.total++;
  (c[p]||c.no).push(b.name)});
 const ranked=Object.values(cats).map(c=>({...c,score:c.love.length*3+c.yes.length*2+c.maybe.length})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score||b.love.length-a.love.length||b.yes.length-a.yes.length);
 return{ranked,all:cats};
}
function asText(){const {ranked}=summary();let t="Mom's Shopping Profile (Mom's Shopping Quiz)\nScore: Love = 3, Yes = 2, Maybe = 1\n\n";
 ranked.forEach((c,i)=>{t+=`${i+1}. ${c.category} (score ${c.score})\n`;if(c.love.length)t+=`   ♥ Love: ${c.love.join(", ")}\n`;if(c.yes.length)t+=`   ✓ Yes: ${c.yes.join(", ")}\n`;if(c.maybe.length)t+=`   ? Maybe: ${c.maybe.join(", ")}\n`});
 const sk=BRANDS.filter(b=>S.picks[b.name]==="no").map(b=>b.name);t+=`\nNo: ${sk.join(", ")||"None"}\n`;return t}
function asJSON(){const {ranked}=summary();return JSON.stringify({generated:new Date().toISOString(),scoring:"love=3, yes=2, maybe=1",topCategories:ranked.map((c,i)=>({rank:i+1,category:c.category,score:c.score,love:c.love,yes:c.yes,maybe:c.maybe})),picks:BRANDS.map(b=>({brand:b.name,category:b.category,choice:S.picks[b.name]||null}))},null,2)}
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function results(){
 document.body.classList.remove("swiping");clearTimeout(idleT);
 const {ranked}=summary();const n=v=>Object.values(S.picks).filter(x=>x===v).length;
 app.innerHTML=`<h1>Your Shopping Profile</h1><p class="muted">${n("love")} Love · ${n("yes")} Yes · ${n("maybe")} Maybe · ${n("no")} No</p>
 <h3 style="margin-top:20px">Top Categories</h3>
 ${ranked.length?ranked.map((c,i)=>`<div class="rank mw-hover"><div class="top"><h3><span class="chip" style="background:${CATC[c.category]};font-size:inherit;padding:0 10px">${i+1}. ${c.category}</span></h3><span class="muted">Score ${c.score}</span></div>
 ${[["love","♥ Love"],["yes","✓ Yes"],["maybe","? Maybe"]].filter(([k])=>c[k].length).map(([k,l])=>`<div class="lbl-${k}" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-top:8px">${l}</div><div class="chips" style="margin-top:4px">${c[k].map(x=>`<span class="chip ${k}">${x}</span>`).join("")}</div>`).join("")}</div>`).join(""):`<p class="muted">No picks yet.</p>`}
 <div class="row"><button class="btn solid mw-hover" id="copy">Copy Results</button><button class="btn mw-hover" id="json">Download JSON</button></div>
 <div class="row" style="margin-top:0"><button class="btn mw-hover" id="txt">Download Text</button><button class="btn mw-hover" id="again">Start Over</button></div>
 <p class="hint muted">Send the copied results or file to Max.</p>`;
 document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(asText());toast("Copied!")}catch{const t=document.createElement("textarea");t.value=asText();document.body.append(t);t.select();document.execCommand("copy");t.remove();toast("Copied!")}};
 document.getElementById("json").onclick=()=>dl("mom-shopping-profile.json",asJSON(),"application/json");
 document.getElementById("txt").onclick=()=>dl("mom-shopping-profile.txt",asText(),"text/plain");
 document.getElementById("again").onclick=reset;
}
function reset(){if(confirm("Start over and clear all picks?")){S={i:0,picks:{}};save();render()}}
document.getElementById("reset").onclick=reset;
render();
</script></body></html>
